name: OrderIQ Daily Alert

on:
  # Runs at 11:00 PM UTC = 7:00 AM AWST (Perth time)
  schedule:
    - cron: '0 23 * * 1-5'

  # Also allows manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  send_daily_alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas resend python-dotenv

      - name: Run daily alert script
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python scripts/send_daily_alert.py